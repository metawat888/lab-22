<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ai Lab Pro: 3D Material Physics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-orange: #ff9900;
            --neon-red: #ff0055;
            --bg-dark: #0a0a0c;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-dark);
            color: #e2e8f0;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        h1, h2, .digital-font {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-panel {
            background: rgba(15, 20, 25, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .control-btn {
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        
        .btn-active-metal { border-color: #cbd5e1; background: rgba(203, 213, 225, 0.15); box-shadow: inset 0 0 10px rgba(255,255,255,0.1); }
        .btn-active-ceramic { border-color: #fdba74; background: rgba(253, 186, 116, 0.15); box-shadow: inset 0 0 10px rgba(253,186,116,0.1); }
        .btn-active-polymer { border-color: #67e8f9; background: rgba(103, 232, 249, 0.15); box-shadow: inset 0 0 10px rgba(103,232,249,0.1); }
        
        .btn-active-elec { border-color: var(--neon-blue); background: rgba(0,243,255,0.15); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
        .btn-active-hammer { border-color: var(--neon-orange); background: rgba(255,153,0,0.15); box-shadow: 0 0 15px rgba(255, 153, 0, 0.3); }
        .btn-active-heat { border-color: var(--neon-red); background: rgba(255,0,85,0.15); box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); }

        #canvas-container {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .panel-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }
        .collapsed-bottom {
            transform: translateY(calc(100% + 1rem));
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="absolute inset-0 pointer-events-none z-10 flex flex-col justify-between p-3 md:p-5 overflow-hidden">
        
        <!-- Top Bar: Logo Only -->
        <div class="flex justify-between items-center w-full max-w-7xl mx-auto pointer-events-auto">
            <!-- Logo -->
            <div class="glass-panel rounded-xl px-3 py-1.5 flex items-center gap-2">
                <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                <div>
                    <h1 class="text-xs md:text-sm font-bold tracking-wider text-white m-0 leading-none">
                        AI LAB <span class="font-light text-cyan-400">PRO</span>
                    </h1>
                    <span class="digital-font text-cyan-500 text-[6px] tracking-widest block mt-0.5">3D PHYSICS</span>
                </div>
            </div>
        </div>

        <!-- Middle Feedback Overlay -->
        <div class="flex justify-center items-center my-auto pointer-events-none">
            <div id="result-overlay" class="px-6 py-2 rounded-full bg-black/80 border border-white/20 text-center opacity-0 transition-opacity duration-500 backdrop-blur-md shadow-[0_4px_20px_rgba(0,0,0,0.6)] pointer-events-auto">
                <span id="result-text" class="text-xs md:text-sm font-bold text-white tracking-wide">Result</span>
            </div>
        </div>

        <!-- Bottom Bar: Material Panel, Test Panel & Execute Button -->
        <div class="flex flex-col md:flex-row justify-center items-end md:items-center w-full max-w-7xl mx-auto pointer-events-auto gap-3 pb-2">
            
            <!-- Panels Container -->
            <div class="flex flex-wrap items-end justify-center gap-3">
                
                <!-- 1. SELECT MATERIAL PANEL -->
                <div class="relative flex flex-col items-center">
                    <!-- Toggle Button Material (Top of panel when at bottom) -->
                    <button onclick="togglePanel('material')" class="glass-panel pointer-events-auto h-5 px-3 rounded-t-lg flex items-center justify-center text-cyan-400 hover:bg-slate-800 transition-colors shadow-sm mb-[-1px] z-20" title="ย่อ/ขยายแผงวัสดุ">
                        <svg id="icon-toggle-material" class="w-3 h-3 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="panel-material" class="glass-panel panel-transition rounded-xl p-2.5 w-52 md:w-56 flex flex-col gap-2 pointer-events-auto">
                        <div class="flex items-center justify-between border-b border-slate-700/60 pb-1.5">
                            <h2 class="text-[9px] md:text-[10px] uppercase tracking-widest text-slate-300 font-bold">1. Select Material</h2>
                            <span class="digital-font text-[8px] text-cyan-400">วัสดุ</span>
                        </div>
                        <div class="grid grid-cols-3 gap-1.5">
                            <button id="btn-mat-metal" onclick="uiSelectMat('metal')" class="control-btn border border-slate-700 bg-slate-800/50 rounded-lg p-1.5 flex flex-col items-center justify-center hover:bg-slate-700 btn-active-metal">
                                <span class="text-xs">🔩</span>
                                <span class="font-semibold text-slate-200 text-[9px] mt-0.5">Metal</span>
                            </button>
                            <button id="btn-mat-ceramic" onclick="uiSelectMat('ceramic')" class="control-btn border border-slate-700 bg-slate-800/50 rounded-lg p-1.5 flex flex-col items-center justify-center hover:bg-slate-700">
                                <span class="text-xs">🍽️</span>
                                <span class="font-semibold text-slate-200 text-[9px] mt-0.5">Ceramic</span>
                            </button>
                            <button id="btn-mat-polymer" onclick="uiSelectMat('polymer')" class="control-btn border border-slate-700 bg-slate-800/50 rounded-lg p-1.5 flex flex-col items-center justify-center hover:bg-slate-700">
                                <span class="text-xs">🥤</span>
                                <span class="font-semibold text-slate-200 text-[9px] mt-0.5">Polymer</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 2. SELECT TEST PANEL -->
                <div class="relative flex flex-col items-center">
                    <!-- Toggle Button Test -->
                    <button onclick="togglePanel('test')" class="glass-panel pointer-events-auto h-5 px-3 rounded-t-lg flex items-center justify-center text-cyan-400 hover:bg-slate-800 transition-colors shadow-sm mb-[-1px] z-20" title="ย่อ/ขยายแผงทดสอบ">
                        <svg id="icon-toggle-test" class="w-3 h-3 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="panel-test" class="glass-panel panel-transition rounded-xl p-2.5 w-52 md:w-56 flex flex-col gap-2 pointer-events-auto">
                        <div class="flex items-center justify-between border-b border-slate-700/60 pb-1.5">
                            <h2 class="text-[9px] md:text-[10px] uppercase tracking-widest text-slate-300 font-bold">2. Select Test</h2>
                            <span class="digital-font text-[8px] text-orange-400">การทดสอบ</span>
                        </div>
                        <div class="grid grid-cols-3 gap-1.5">
                            <button id="btn-test-elec" onclick="uiSelectTest('elec')" class="control-btn border border-slate-700 bg-slate-800/50 rounded-lg p-1.5 flex flex-col items-center justify-center hover:bg-slate-700 btn-active-elec">
                                <span class="text-xs">⚡</span>
                                <span class="font-semibold text-slate-200 text-[9px] mt-0.5">นำไฟฟ้า</span>
                            </button>
                            <button id="btn-test-hammer" onclick="uiSelectTest('hammer')" class="control-btn border border-slate-700 bg-slate-800/50 rounded-lg p-1.5 flex flex-col items-center justify-center hover:bg-slate-700">
                                <span class="text-xs">🔨</span>
                                <span class="font-semibold text-slate-200 text-[9px] mt-0.5">กระแทก</span>
                            </button>
                            <button id="btn-test-heat" onclick="uiSelectTest('heat')" class="control-btn border border-slate-700 bg-slate-800/50 rounded-lg p-1.5 flex flex-col items-center justify-center hover:bg-slate-700">
                                <span class="text-xs">🔥</span>
                                <span class="font-semibold text-slate-200 text-[9px] mt-0.5">ความร้อน</span>
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Execute Button -->
            <div>
                <button id="btn-execute" onclick="executeSimulation()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-5 py-3 rounded-xl shadow-[0_0_15px_rgba(0,243,255,0.4)] transition-all transform hover:scale-[1.05] active:scale-95 digital-font text-[10px] tracking-widest disabled:opacity-50 disabled:cursor-not-allowed">
                    EXECUTE
                </button>
            </div>

        </div>

    </div>

    <script>
        // --- GLOBAL STATE ---
        let currentMat = 'metal';
        let currentTest = 'elec';
        let isSimulating = false;
        let isMaterialCollapsed = false;
        let isTestCollapsed = false;

        function togglePanel(panelName) {
            if (panelName === 'material') {
                isMaterialCollapsed = !isMaterialCollapsed;
                const panel = document.getElementById('panel-material');
                const icon = document.getElementById('icon-toggle-material');
                if (isMaterialCollapsed) {
                    panel.classList.add('collapsed-bottom');
                    icon.style.transform = 'rotate(180deg)';
                } else {
                    panel.classList.remove('collapsed-bottom');
                    icon.style.transform = 'rotate(0deg)';
                }
            } else if (panelName === 'test') {
                isTestCollapsed = !isTestCollapsed;
                const panel = document.getElementById('panel-test');
                const icon = document.getElementById('icon-toggle-test');
                if (isTestCollapsed) {
                    panel.classList.add('collapsed-bottom');
                    icon.style.transform = 'rotate(180deg)';
                } else {
                    panel.classList.remove('collapsed-bottom');
                    icon.style.transform = 'rotate(0deg)';
                }
            }
        }

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b111a);
        scene.fog = new THREE.FogExp2(0x0b111a, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, window.innerWidth < 768 ? 20 : 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2; 
        controls.minDistance = 5;
        controls.maxDistance = 25;
        controls.target.set(0, 1.5, 0);

        // --- LIGHTING SETUP ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); 
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x64748b, 0.6);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(2, 15, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0x00f3ff, 0.8, 30);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);

        // --- LAB ROOM ENVIRONMENT ---
        const floorGeo = new THREE.PlaneGeometry(80, 80);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.15, metalness: 0.4 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(80, 40, 2), wallMat);
        backWall.position.set(0, 20, -20);
        backWall.receiveShadow = true;
        scene.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(2, 40, 80), wallMat);
        leftWall.position.set(-25, 20, 0);
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        const accentMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
        const accent1 = new THREE.Mesh(new THREE.BoxGeometry(80, 0.2, 2.1), accentMat);
        accent1.position.set(0, 12, -20);
        scene.add(accent1);

        const screenGeo = new THREE.PlaneGeometry(16, 8);
        const screenMat = new THREE.MeshBasicMaterial({ color: 0x0ea5e9, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
        const screen = new THREE.Mesh(screenGeo, screenMat);
        screen.position.set(0, 10, -18.9);
        scene.add(screen);

        const frameGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(16.2, 8.2));
        const frameMat = new THREE.LineBasicMaterial({ color: 0x00f3ff, linewidth: 2 });
        const frame = new THREE.LineSegments(frameGeo, frameMat);
        frame.position.set(0, 10, -18.9);
        scene.add(frame);

        const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const stripe = new THREE.Mesh(new THREE.PlaneGeometry(12, 0.2), stripeMat);
        stripe.rotation.x = -Math.PI/2;
        stripe.position.set(0, 0.01, 5);
        scene.add(stripe);

        // --- LAB WORKBENCH ---
        const tableGroup = new THREE.Group();
        const topGeo = new THREE.BoxGeometry(10, 0.4, 6);
        const topMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.6 });
        const tableTop = new THREE.Mesh(topGeo, topMat);
        tableTop.position.y = 0.4;
        tableTop.receiveShadow = true;
        tableTop.castShadow = true;
        tableGroup.add(tableTop);

        const trimGeo = new THREE.BoxGeometry(10.1, 0.1, 6.1);
        const trimMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 0.6 });
        const tableTrim = new THREE.Mesh(trimGeo, trimMat);
        tableTrim.position.y = 0.4;
        tableGroup.add(tableTrim);

        const legGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.4);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.9, roughness: 0.2 });
        [[-4.5, 0.2, -2.5], [4.5, 0.2, -2.5], [-4.5, 0.2, 2.5], [4.5, 0.2, 2.5]].forEach(pos => {
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(pos[0], pos[1], pos[2]);
            leg.castShadow = true;
            tableGroup.add(leg);
        });
        scene.add(tableGroup);

        // --- MATERIALS GENERATOR ---
        let currentObject = null;
        let originalY = 0;

        function createMetal() {
            const geo = new THREE.CylinderGeometry(1, 1, 2.5, 32);
            const mat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 1.0, roughness: 0.2 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = 0.6 + 1.25; 
            return mesh;
        }

        function createCeramic() {
            const points = [];
            for (let i = 0; i <= 30; i++) {
                const t = i / 30;
                const x = Math.sin(t * Math.PI) * 0.9 + 0.3 - Math.sin(t*Math.PI*2)*0.15;
                const y = t * 2.8; 
                points.push(new THREE.Vector2(x, y));
            }
            const geo = new THREE.LatheGeometry(points, 64);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.05, roughness: 0.1, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = 0.6;
            return mesh;
        }

        function createPolymer() {
            const geo = new THREE.TorusGeometry(0.9, 0.4, 32, 64);
            const mat = new THREE.MeshPhysicalMaterial({ color: 0x0ea5e9, metalness: 0.1, roughness: 0.4, transmission: 0.2, thickness: 0.5, clearcoat: 0.5, clearcoatRoughness: 0.2 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = 0.6 + 0.4;
            mesh.rotation.x = Math.PI / 2;
            return mesh;
        }

        let shatterGroup = null;
        let shatterShards = [];

        function loadMaterial(type) {
            if (currentObject) {
                scene.remove(currentObject);
                if (currentObject.geometry) currentObject.geometry.dispose();
                if (currentObject.material) currentObject.material.dispose();
            }
            if(shatterGroup) {
                scene.remove(shatterGroup);
                shatterGroup = null;
            }

            switch(type) {
                case 'metal': currentObject = createMetal(); break;
                case 'ceramic': currentObject = createCeramic(); break;
                case 'polymer': currentObject = createPolymer(); break;
            }
            
            currentObject.castShadow = true;
            currentObject.receiveShadow = true;
            originalY = currentObject.position.y;
            currentObject.userData.originalScale = currentObject.scale.clone();
            scene.add(currentObject);
        }

        // --- LAB TOOLS ---
        const electrodeGroup = new THREE.Group();
        electrodeGroup.position.y = 8;
        
        const leftEl = new THREE.Group();
        leftEl.position.set(-3, 0, 0);
        const rightEl = new THREE.Group();
        rightEl.position.set(3, 0, 0);

        const handleMatRed = new THREE.MeshStandardMaterial({color: 0xd92626, roughness: 0.4});
        const handleMatBlack = new THREE.MeshStandardMaterial({color: 0x222222, roughness: 0.4});
        const metalTipMat = new THREE.MeshStandardMaterial({color: 0xe2e8f0, metalness: 0.9, roughness: 0.2});
        const rubberWireMat = new THREE.MeshStandardMaterial({color: 0x111111, roughness: 0.8});

        const handleGeo = new THREE.CylinderGeometry(0.12, 0.12, 1.2, 16);
        const guardGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.1, 16);
        const tipBaseGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.3, 16);
        const tipConeGeo = new THREE.ConeGeometry(0.04, 0.4, 16);

        // Left Probe
        leftEl.add(new THREE.Mesh(handleGeo, handleMatRed));
        const gL = new THREE.Mesh(guardGeo, handleMatRed); gL.position.y = -0.75; leftEl.add(gL);
        const tBL = new THREE.Mesh(tipBaseGeo, metalTipMat); tBL.position.y = -0.95; leftEl.add(tBL);
        const tCL = new THREE.Mesh(tipConeGeo, metalTipMat); tCL.position.y = -1.3; leftEl.add(tCL);

        // Right Probe
        rightEl.add(new THREE.Mesh(handleGeo, handleMatBlack));
        const gR = new THREE.Mesh(guardGeo, handleMatBlack); gR.position.y = -0.75; rightEl.add(gR);
        const tBR = new THREE.Mesh(tipBaseGeo, metalTipMat); tBR.position.y = -0.95; rightEl.add(tBR);
        const tCR = new THREE.Mesh(tipConeGeo, metalTipMat); tCR.position.y = -1.3; rightEl.add(tCR);

        const pathL = new THREE.CubicBezierCurve3(new THREE.Vector3(0, 0.5, 0), new THREE.Vector3(-1.5, 3, 1), new THREE.Vector3(-0.5, 6, -2), new THREE.Vector3(0, 10, -2));
        leftEl.add(new THREE.Mesh(new THREE.TubeGeometry(pathL, 32, 0.06, 8, false), rubberWireMat));

        const pathR = new THREE.CubicBezierCurve3(new THREE.Vector3(0, 0.5, 0), new THREE.Vector3(1.5, 3, 1), new THREE.Vector3(0.5, 6, -2), new THREE.Vector3(0, 10, -2));
        rightEl.add(new THREE.Mesh(new THREE.TubeGeometry(pathR, 32, 0.06, 8, false), rubberWireMat));
        
        electrodeGroup.add(leftEl);
        electrodeGroup.add(rightEl);
        scene.add(electrodeGroup);

        const arcLines = [];
        const arcMaterial = new THREE.LineBasicMaterial({ color: 0x00f3ff, linewidth: 3, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        for(let i=0; i<4; i++) {
            const pos = new Float32Array(5 * 3);
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const line = new THREE.Line(geo, arcMaterial);
            arcLines.push(line);
            electrodeGroup.add(line);
        }

        const arcLight = new THREE.PointLight(0x00f3ff, 0, 15);
        arcLight.position.y = -1.5;
        electrodeGroup.add(arcLight);

        // Hammer
        const hammerGroup = new THREE.Group();
        const hammerHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4), new THREE.MeshStandardMaterial({color: 0x5c2b07, roughness: 0.9}));
        hammerHandle.position.y = 2;
        hammerHandle.castShadow = true;
        const hammerHead = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 1.0), new THREE.MeshStandardMaterial({color: 0x475569, metalness: 0.8, roughness: 0.3}));
        hammerHead.position.set(-0.2, 4, 0);
        hammerHead.castShadow = true;
        hammerGroup.add(hammerHandle);
        hammerGroup.add(hammerHead);
        hammerGroup.visible = false;
        scene.add(hammerGroup);

        // Burner
        const burnerGroup = new THREE.Group();
        burnerGroup.position.y = 0.6;
        burnerGroup.visible = false;
        const fireLight = new THREE.PointLight(0xff6600, 0, 15);
        fireLight.position.y = 1.0;
        burnerGroup.add(fireLight);

        const fireParticleCount = 100;
        const fireGeo = new THREE.BufferGeometry();
        const firePos = new Float32Array(fireParticleCount * 3);
        const fireColors = new Float32Array(fireParticleCount * 3);
        const fireVel = [];
        const colorBase = new THREE.Color(0xff4500);
        const colorTip = new THREE.Color(0xffcc00);

        for(let i=0; i<fireParticleCount; i++) {
            firePos[i*3] = (Math.random() - 0.5) * 2.0;
            firePos[i*3+1] = Math.random() * 1.5;
            firePos[i*3+2] = (Math.random() - 0.5) * 2.0;
            const mixedColor = colorBase.clone().lerp(colorTip, Math.random());
            fireColors[i*3] = mixedColor.r; fireColors[i*3+1] = mixedColor.g; fireColors[i*3+2] = mixedColor.b;
            fireVel.push({ x: (Math.random() - 0.5) * 0.02, y: Math.random() * 0.08 + 0.04, z: (Math.random() - 0.5) * 0.02 });
        }
        fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3));
        fireGeo.setAttribute('color', new THREE.BufferAttribute(fireColors, 3));

        const canvasTex = document.createElement('canvas');
        canvasTex.width = 32; canvasTex.height = 32;
        const ctxTex = canvasTex.getContext('2d');
        const grad = ctxTex.createRadialGradient(16, 16, 0, 16, 16, 16);
        grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctxTex.fillStyle = grad; ctxTex.fillRect(0, 0, 32, 32);
        
        const fireMat = new THREE.PointsMaterial({ size: 0.5, vertexColors: true, map: new THREE.CanvasTexture(canvasTex), transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
        const fireParticles = new THREE.Points(fireGeo, fireMat);
        burnerGroup.add(fireParticles);
        scene.add(burnerGroup);

        // --- ANIMATIONS & HELPERS ---
        const animations = [];
        const easeOutQuad = t => t * (2 - t);
        const easeInOutQuad = t => t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        const easeOutElastic = t => {
            const c4 = (2 * Math.PI) / 3;
            return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
        };

        function animateTween(obj, prop, target, duration, easing = easeInOutQuad, onComplete = null) {
            const startVal = obj[prop];
            const startTime = performance.now();
            animations.push({
                update: (time) => {
                    const elapsed = time - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    obj[prop] = startVal + (target - startVal) * easing(progress);
                    if (progress >= 1) {
                        if (onComplete) onComplete();
                        return true; 
                    }
                    return false; 
                }
            });
        }

        function showResult(text, colorClass) {
            const overlay = document.getElementById('result-overlay');
            const resultText = document.getElementById('result-text');
            resultText.className = `text-xs md:text-sm font-bold tracking-wide ${colorClass}`;
            resultText.innerText = text;
            overlay.style.opacity = '1';
        }

        function hideResult() {
            document.getElementById('result-overlay').style.opacity = '0';
        }

        function uiSelectMat(mat) {
            if (isSimulating) return;
            currentMat = mat;
            ['metal', 'ceramic', 'polymer'].forEach(m => document.getElementById(`btn-mat-${m}`).classList.remove(`btn-active-${m}`));
            document.getElementById(`btn-mat-${mat}`).classList.add(`btn-active-${mat}`);
            resetStage();
            hideResult();
        }

        function uiSelectTest(test) {
            if (isSimulating) return;
            currentTest = test;
            ['elec', 'hammer', 'heat'].forEach(t => document.getElementById(`btn-test-${t}`).classList.remove(`btn-active-${t}`));
            document.getElementById(`btn-test-${test}`).classList.add(`btn-active-${test}`);
            resetStage();
            hideResult();
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        function resetStage() {
            electrodeGroup.position.y = 8;
            leftEl.position.x = -3;
            rightEl.position.x = 3;
            arcMaterial.opacity = 0;
            arcLight.intensity = 0;
            
            hammerGroup.visible = false;
            hammerGroup.rotation.z = -Math.PI / 4;

            burnerGroup.visible = false;
            fireLight.intensity = 0;

            loadMaterial(currentMat);
        }

        // --- SIMULATION EXECUTION ---
        async function executeSimulation() {
            if (isSimulating) return;
            isSimulating = true;
            document.getElementById('btn-execute').disabled = true;
            hideResult();
            resetStage();
            
            let targetY = 1.85;
            let targetRadius = 1.0; 
            if(currentMat === 'ceramic') { targetY = 2.0; targetRadius = 0.85; }
            if(currentMat === 'polymer') { targetY = 1.0; targetRadius = 1.3; }

            animateTween(camera.position, 'x', window.innerWidth < 768 ? 0 : 2, 1000);
            animateTween(camera.position, 'y', window.innerWidth < 768 ? 6 : 5, 1000);
            animateTween(camera.position, 'z', window.innerWidth < 768 ? 16 : 12, 1000);
            controls.target.set(0, 1.5, 0);

            await sleep(800);

            if (currentTest === 'elec') {
                animateTween(electrodeGroup.position, 'y', targetY + 1.5, 800, easeOutQuad);
                await sleep(900);
                
                animateTween(leftEl.position, 'x', -targetRadius, 400, easeOutQuad);
                animateTween(rightEl.position, 'x', targetRadius, 400, easeOutQuad);
                await sleep(500);
                
                if (currentMat === 'metal') {
                    arcMaterial.opacity = 1;
                    animations.push({
                        start: performance.now(),
                        update: function(time) {
                            if(!isSimulating) return true;
                            arcLight.intensity = 5 + Math.random() * 10;
                            currentObject.material.emissive.setHex(0x0044aa);
                            currentObject.material.emissiveIntensity = 0.5 + Math.random()*0.5;

                            arcLines.forEach(line => {
                                const positions = line.geometry.attributes.position.array;
                                positions[0] = -targetRadius; positions[1] = -1.5; positions[2] = 0;
                                positions[12] = targetRadius; positions[13] = -1.5; positions[14] = 0;
                                const stepX = (targetRadius * 2) / 4; 
                                for(let j=1; j<=3; j++) {
                                    positions[j*3] = -targetRadius + (stepX * j) + (Math.random()-0.5)*0.6;
                                    positions[j*3+1] = -1.5 + (Math.random()-0.5)*0.8;
                                    positions[j*3+2] = (Math.random()-0.5)*0.8;
                                }
                                line.geometry.attributes.position.needsUpdate = true;
                            });
                            return false;
                        }
                    });

                    await sleep(2000);
                    showResult("นำไฟฟ้าได้ดี (Excellent Conductor)", "text-green-400");
                } else {
                    arcMaterial.opacity = 0.3; arcLight.intensity = 2;
                    await sleep(150);
                    arcMaterial.opacity = 0; arcLight.intensity = 0;
                    showResult("เป็นฉนวนไฟฟ้า (Insulator)", "text-orange-400");
                }
            } 
            else if (currentTest === 'hammer') {
                let hitY = targetY;
                if(currentMat === 'metal') hitY = originalY + 2.5 * 0.7;
                if(currentMat === 'ceramic') hitY = 2.0;
                if(currentMat === 'polymer') hitY = originalY + 0.4;

                hammerGroup.position.set(4.0 + targetRadius, hitY, 0); 
                hammerGroup.visible = true;
                hammerGroup.rotation.z = -Math.PI / 6;
                
                animateTween(hammerGroup.rotation, 'z', -Math.PI / 4, 600, easeOutQuad);
                await sleep(700);
                
                animateTween(hammerGroup.rotation, 'z', Math.PI / 2, 200, (t) => t * t);
                await sleep(200);
                
                const origCam = camera.position.clone();
                animations.push({
                    start: performance.now(),
                    update: function(t) {
                        const elapsed = performance.now() - this.start;
                        if(elapsed > 200) { camera.position.copy(origCam); return true; }
                        const intensity = (200 - elapsed) / 200 * 0.5;
                        camera.position.x = origCam.x + (Math.random() - 0.5) * intensity;
                        camera.position.y = origCam.y + (Math.random() - 0.5) * intensity;
                        return false;
                    }
                });

                if (currentMat === 'metal') {
                    animateTween(currentObject.scale, 'y', 0.7, 100);
                    animateTween(currentObject.scale, 'x', 1.2, 100);
                    animateTween(currentObject.scale, 'z', 1.2, 100);
                    animateTween(currentObject.position, 'y', originalY - 0.4, 100);
                    animateTween(hammerGroup.rotation, 'z', Math.PI / 2.2, 300, easeOutQuad);
                    showResult("มีความเหนียวสูง ไม่แตกหัก (Tough & Malleable)", "text-green-400");
                } 
                else if (currentMat === 'ceramic') {
                    currentObject.visible = false;
                    shatterGroup = new THREE.Group();
                    shatterShards = [];
                    const shardGeo = new THREE.DodecahedronGeometry(0.3, 0);
                    const shardMat = currentObject.material.clone();
                    
                    for(let i=0; i<40; i++) {
                        const shard = new THREE.Mesh(shardGeo, shardMat);
                        shard.position.copy(currentObject.position);
                        shard.position.y += Math.random() * 2.5 - 1;
                        shard.position.x += (Math.random() - 0.5) * 1.5;
                        shard.position.z += (Math.random() - 0.5) * 1.5;
                        const scale = Math.random() * 0.8 + 0.2;
                        shard.scale.set(scale, scale, scale);
                        shard.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                        shard.castShadow = true;
                        shatterGroup.add(shard);
                        
                        shatterShards.push({
                            mesh: shard,
                            velY: Math.random() * 8 + 2,
                            velX: shard.position.x * (Math.random() * 5 + 2),
                            velZ: shard.position.z * (Math.random() * 5 + 2),
                            rotX: (Math.random() - 0.5) * 10,
                            rotY: (Math.random() - 0.5) * 10
                        });
                    }
                    scene.add(shatterGroup);
                    animateTween(hammerGroup.rotation, 'z', Math.PI / 1.5, 300, easeOutQuad);
                    showResult("มีความเปราะสูง แตกหักง่าย (Brittle)", "text-red-400");
                }
                else if (currentMat === 'polymer') {
                    animateTween(currentObject.scale, 'y', 0.4, 100);
                    animateTween(currentObject.scale, 'x', 1.3, 100);
                    animateTween(currentObject.scale, 'z', 1.3, 100);
                    animateTween(currentObject.position, 'y', originalY - 0.3, 100, easeInOutQuad, () => {
                        animateTween(currentObject.scale, 'y', 1, 600, easeOutElastic);
                        animateTween(currentObject.scale, 'x', 1, 600, easeOutElastic);
                        animateTween(currentObject.scale, 'z', 1, 600, easeOutElastic);
                        animateTween(currentObject.position, 'y', originalY, 600, easeOutElastic);
                    });
                    animateTween(hammerGroup.rotation, 'z', 0, 400, easeOutQuad);
                    showResult("มีความยืดหยุ่นสูง (Elastic & Tough)", "text-cyan-400");
                }
            }
            else if (currentTest === 'heat') {
                burnerGroup.visible = true;
                animateTween(fireLight, 'intensity', 3, 1000);
                await sleep(1500);

                if (currentMat === 'metal' || currentMat === 'ceramic') {
                    const targetColor = currentMat === 'metal' ? 0xff4400 : 0xff7700;
                    animations.push({
                        start: performance.now(),
                        update: function(time) {
                            const elapsed = time - this.start;
                            const t = Math.min(elapsed / 3000, 1);
                            currentObject.material.emissive.setHex(targetColor);
                            currentObject.material.emissiveIntensity = t * 1.5;
                            return t >= 1;
                        }
                    });
                    await sleep(3000);
                    showResult("ทนความร้อนสูง (High Thermal Resistance)", "text-green-400");
                } 
                else if (currentMat === 'polymer') {
                    const meltDuration = 3500;
                    animateTween(currentObject.scale, 'y', 0.05, meltDuration, easeInOutQuad);
                    animateTween(currentObject.scale, 'x', 2.5, meltDuration, easeInOutQuad);
                    animateTween(currentObject.scale, 'z', 2.5, meltDuration, easeInOutQuad);
                    animateTween(currentObject.position, 'y', 0.6, meltDuration, easeInOutQuad);
                    await sleep(3500);
                    showResult("ไม่ทนความร้อน หลอมเหลวได้ง่าย (Low Thermal Resistance)", "text-red-500");
                }
            }

            await sleep(2500);
            isSimulating = false;
            document.getElementById('btn-execute').disabled = false;
        }

        // --- RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = performance.now();

            for (let i = animations.length - 1; i >= 0; i--) {
                if (animations[i].update(time)) {
                    animations.splice(i, 1);
                }
            }

            if(burnerGroup.visible) {
                const positions = fireParticles.geometry.attributes.position.array;
                for(let i=0; i<fireParticleCount; i++) {
                    positions[i*3] += fireVel[i].x;
                    positions[i*3+1] += fireVel[i].y; 
                    positions[i*3+2] += fireVel[i].z;
                    if(positions[i*3+1] > 3) {
                        positions[i*3] = (Math.random() - 0.5) * 2.0;
                        positions[i*3+1] = 0;
                        positions[i*3+2] = (Math.random() - 0.5) * 2.0;
                    }
                }
                fireParticles.geometry.attributes.position.needsUpdate = true;
            }

            if(shatterGroup) {
                const gravity = -20.0;
                const floorLevel = 0.6;
                shatterShards.forEach(s => {
                    if(s.mesh.position.y > floorLevel || s.velY > 0) {
                        s.velY += gravity * delta;
                        s.mesh.position.x += s.velX * delta;
                        s.mesh.position.y += s.velY * delta;
                        s.mesh.position.z += s.velZ * delta;
                        s.mesh.rotation.x += s.rotX * delta;
                        s.mesh.rotation.y += s.rotY * delta;

                        if(s.mesh.position.y <= floorLevel) {
                            s.mesh.position.y = floorLevel;
                            s.velY *= -0.3;
                            s.velX *= 0.8;
                            s.velZ *= 0.8;
                            s.rotX *= 0.5;
                            s.rotY *= 0.5;
                            if(Math.abs(s.velY) < 0.5) {
                                s.velY = 0; s.velX = 0; s.velZ = 0; s.rotX = 0; s.rotY = 0;
                            }
                        }
                    }
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.position.z = window.innerWidth < 768 ? 20 : 14;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        resetStage();
        animate();
    </script>
</body>
</html>
